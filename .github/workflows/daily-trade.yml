name: Daily Trading Bot Run

on:
  schedule:
    # 9:05 PM UTC = 4:05 PM Eastern, shortly after US market close
    # GitHub's cron scheduler can run a few minutes late, that's normal
    - cron: "5 21 * * 1-5"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run trading bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py

      - name: Commit updated history
        run: |
          git config user.name "flx-trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git diff --quiet --cached || git commit -m "Update trade history $(date -u +'%Y-%m-%d')"
          git push
