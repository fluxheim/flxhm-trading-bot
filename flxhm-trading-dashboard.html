<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FLXHM // Signal Dashboard</title>
<style>
  :root{
    --void: #05070a;
    --deep: #0a1016;
    --spore: #12b886;
    --spore-dim: #0d5c47;
    --pulse: #7c5cff;
    --warn: #ff6b6b;
    --mist: #6b7d8a;
    --bone: #dfe6e8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at top, #0c141a 0%, var(--void) 60%);
    color: var(--bone);
    font-family: 'Courier New', ui-monospace, monospace;
    min-height:100vh;
    padding: 32px 20px 60px;
  }
  .wrap{max-width:920px; margin:0 auto;}
  header{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid #1a2530; padding-bottom:16px; margin-bottom:28px;
    flex-wrap:wrap; gap:10px;
  }
  h1{
    font-size:15px; letter-spacing:0.35em; font-weight:400;
    color: var(--spore); text-transform:uppercase;
  }
  h1 span{color:var(--mist);}
  .status{font-size:11px; color:var(--mist); letter-spacing:0.1em;}
  .status.live{color:var(--spore);}
  .config{
    display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;
  }
  input[type=text]{
    flex:1; min-width:220px;
    background: var(--deep); border:1px solid #1a2530; color:var(--bone);
    padding:10px 12px; font-family:inherit; font-size:12px; border-radius:2px;
  }
  input[type=text]:focus{outline:1px solid var(--spore);}
  button{
    background: transparent; border:1px solid var(--spore-dim); color:var(--spore);
    padding:10px 18px; font-family:inherit; font-size:11px; letter-spacing:0.1em;
    text-transform:uppercase; cursor:pointer; border-radius:2px;
  }
  button:hover{background: var(--spore-dim); color:var(--void);}
  .grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; margin-bottom:28px;
  }
  @media(max-width:700px){.grid{grid-template-columns:1fr;}}
  .card{
    background: var(--deep); border:1px solid #16202a; border-radius:3px;
    padding:16px; position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; width:2px; height:100%;
    background: var(--spore-dim);
  }
  .card.buy::before{background:var(--spore);}
  .card.sell::before{background:var(--warn);}
  .ticker{font-size:13px; letter-spacing:0.15em; color:var(--bone); margin-bottom:6px;}
  .price{font-size:22px; color:var(--spore); font-weight:bold; margin-bottom:8px;}
  .row{display:flex; justify-content:space-between; font-size:10px; color:var(--mist); margin-bottom:3px;}
  .row b{color:var(--bone);}
  .signal-tag{
    display:inline-block; font-size:9px; letter-spacing:0.15em; padding:3px 8px;
    border-radius:10px; margin-top:8px; text-transform:uppercase;
  }
  .signal-tag.hold{background:#16202a; color:var(--mist);}
  .signal-tag.buy{background: rgba(18,184,134,0.15); color:var(--spore);}
  .signal-tag.sell{background: rgba(255,107,107,0.15); color:var(--warn);}
  .panel{
    background: var(--deep); border:1px solid #16202a; border-radius:3px;
    padding:20px; margin-bottom:20px;
  }
  .panel h2{
    font-size:11px; letter-spacing:0.2em; color:var(--mist); text-transform:uppercase;
    margin-bottom:14px;
  }
  canvas{width:100%; display:block;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--mist); font-size:12px; line-height:1.8;
  }
  .empty .spore-dot{
    width:6px; height:6px; background:var(--spore); border-radius:50%;
    display:inline-block; margin-right:8px; animation: pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:0.3;} 50%{opacity:1;}}
  .legend{display:flex; gap:16px; font-size:10px; color:var(--mist); margin-top:10px;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  footer{text-align:center; font-size:10px; color:#334; margin-top:30px; letter-spacing:0.1em;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FLXHM <span>// signal dashboard</span></h1>
    <div class="status" id="status">disconnected</div>
  </header>

  <div class="config">
    <input type="text" id="urlInput" placeholder="Paste your raw GitHub history.json URL — e.g. https://raw.githubusercontent.com/USER/REPO/main/data/history.json">
    <button id="loadBtn">Connect</button>
  </div>

  <div id="content">
    <div class="empty">
      <span class="spore-dot"></span>Awaiting connection. Paste your repo's raw history.json URL above once your first GitHub Action run completes.
    </div>
  </div>

  <footer>MOVING AVERAGE CROSSOVER · 20/50 DAY · PAPER ACCOUNT ONLY</footer>
</div>

<script>
const state = { data: null };

document.getElementById('loadBtn').addEventListener('click', loadData);
document.getElementById('urlInput').addEventListener('keydown', e => { if(e.key==='Enter') loadData(); });

async function loadData(){
  const url = document.getElementById('urlInput').value.trim();
  const statusEl = document.getElementById('status');
  if(!url){ return; }
  statusEl.textContent = 'connecting...';
  statusEl.className = 'status';
  try{
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
    if(!res.ok) throw new Error('fetch failed: ' + res.status);
    const json = await res.json();
    state.data = json;
    statusEl.textContent = 'live';
    statusEl.className = 'status live';
    render();
  } catch(err){
    statusEl.textContent = 'error: ' + err.message;
    document.getElementById('content').innerHTML =
      '<div class="empty">Could not load that URL. Make sure it\'s the raw file link (raw.githubusercontent.com) and that at least one bot run has committed data.</div>';
  }
}

function render(){
  const runs = state.data.runs || [];
  const content = document.getElementById('content');
  if(runs.length === 0){
    content.innerHTML = '<div class="empty"><span class="spore-dot"></span>Connected, but no runs logged yet. Check back after the next scheduled run.</div>';
    return;
  }

  const latest = runs[runs.length-1];
  let html = '<div class="grid">';
  latest.symbols.forEach(sym => {
    if(sym.error){
      html += `<div class="card"><div class="ticker">${sym.symbol}</div><div class="row" style="color:var(--warn)">Error: ${sym.error}</div></div>`;
      return;
    }
    html += `
      <div class="card ${sym.signal}">
        <div class="ticker">${sym.symbol}</div>
        <div class="price">$${sym.close}</div>
        <div class="row"><span>20-day MA</span><b>${sym.short_ma}</b></div>
        <div class="row"><span>50-day MA</span><b>${sym.long_ma}</b></div>
        <div class="row"><span>Position</span><b>${sym.holding ? 'Holding' : 'Flat'}</b></div>
        <span class="signal-tag ${sym.signal}">${sym.signal}</span>
      </div>`;
  });
  html += '</div>';

  html += `
    <div class="panel">
      <h2>Portfolio Value</h2>
      <canvas id="portfolioChart" height="180"></canvas>
    </div>
    <div class="panel">
      <h2>Price vs Moving Averages</h2>
      <div id="priceCharts"></div>
    </div>
  `;

  content.innerHTML = html;
  drawPortfolioChart(runs);
  drawPriceCharts(runs);
}

function drawPortfolioChart(runs){
  const canvas = document.getElementById('portfolioChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 180;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.scale(dpr,dpr);

  const values = runs.map(r => r.portfolio_value).filter(v => v !== undefined);
  if(values.length < 2){ ctx.fillStyle='#6b7d8a'; ctx.font='11px monospace'; ctx.fillText('Need at least 2 runs to plot a trend.', 10, 90); return; }

  const min = Math.min(...values), max = Math.max(...values);
  const pad = 20;
  const range = (max-min) || 1;

  ctx.strokeStyle = '#12b886';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  values.forEach((v,i) => {
    const x = pad + (i/(values.length-1)) * (w - pad*2);
    const y = h - pad - ((v-min)/range) * (h - pad*2);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();

  ctx.fillStyle = 'rgba(18,184,134,0.08)';
  ctx.lineTo(w-pad, h-pad);
  ctx.lineTo(pad, h-pad);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#6b7d8a';
  ctx.font = '10px monospace';
  ctx.fillText('$' + max.toLocaleString(), 4, 14);
  ctx.fillText('$' + min.toLocaleString(), 4, h-6);
}

function drawPriceCharts(runs){
  const symbols = [...new Set(runs.flatMap(r => r.symbols.filter(s=>!s.error).map(s => s.symbol)))];
  const container = document.getElementById('priceCharts');

  symbols.forEach(sym => {
    const wrapper = document.createElement('div');
    wrapper.style.marginBottom = '20px';
    wrapper.innerHTML = `<div style="font-size:11px;color:#dfe6e8;margin-bottom:6px;">${sym}</div>
      <canvas height="120"></canvas>
      <div class="legend">
        <span><i class="dot" style="background:#dfe6e8"></i>Close</span>
        <span><i class="dot" style="background:#12b886"></i>20-day MA</span>
        <span><i class="dot" style="background:#7c5cff"></i>50-day MA</span>
      </div>`;
    container.appendChild(wrapper);

    const canvas = wrapper.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 860, h = 120;
    canvas.width = w*dpr; canvas.height = h*dpr;
    ctx.scale(dpr,dpr);

    const points = runs.map(r => r.symbols.find(s => s.symbol === sym && !s.error)).filter(Boolean);
    if(points.length < 2){
      ctx.fillStyle='#6b7d8a'; ctx.font='10px monospace';
      ctx.fillText('Not enough history yet for ' + sym + '.', 10, 60);
      return;
    }

    const all = points.flatMap(p => [p.close, p.short_ma, p.long_ma]).filter(v=>v!==null && v!==undefined);
    const min = Math.min(...all), max = Math.max(...all);
    const range = (max-min) || 1;
    const pad = 10;

    function plot(key, color){
      ctx.strokeStyle = color; ctx.lineWidth = 1.3;
      ctx.beginPath();
      points.forEach((p,i) => {
        const v = p[key];
        if(v===null || v===undefined) return;
        const x = pad + (i/(points.length-1)) * (w-pad*2);
        const y = h - pad - ((v-min)/range) * (h-pad*2);
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      });
      ctx.stroke();
    }
    plot('close', '#dfe6e8');
    plot('short_ma', '#12b886');
    plot('long_ma', '#7c5cff');

    // mark buy/sell signals
    points.forEach((p,i) => {
      if(p.signal === 'buy' || p.signal === 'sell'){
        const x = pad + (i/(points.length-1)) * (w-pad*2);
        const y = h - pad - ((p.close-min)/range) * (h-pad*2);
        ctx.fillStyle = p.signal === 'buy' ? '#12b886' : '#ff6b6b';
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI*2);
        ctx.fill();
      }
    });
  });
}
</script>
</body>
</html>
